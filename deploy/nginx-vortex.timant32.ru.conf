# TLS site for vortex.timant32.ru (host nginx → docker SPA on :18080).
# Install: copy to /etc/nginx/sites-available/ and enable; certbot may edit SSL lines.

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vortex.timant32.ru;

    ssl_certificate /etc/letsencrypt/live/vortex.timant32.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vortex.timant32.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Agent binaries — host static files, NOT the SPA container.
    # Files: /opt/vortex-web/agent-bins/vortex-agent-linux-{amd64,arm64}
    location ^~ /agent/ {
        alias /opt/vortex-web/agent-bins/;
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name vortex.timant32.ru;
    return 301 https://$host$request_uri;
}
