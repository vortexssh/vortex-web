# Reference SSL site after Certbot (usually managed automatically).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vortex.timant32.ru;

    ssl_certificate /etc/letsencrypt/live/vortex.timant32.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vortex.timant32.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name vortex.timant32.ru;
    return 301 https://$host$request_uri;
}
