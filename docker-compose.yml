services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.vortex.timant32.ru/api/v1}
        VITE_WS_URL: ${VITE_WS_URL:-wss://api.vortex.timant32.ru/ws}
        VITE_AGENT_CORE_URL: ${VITE_AGENT_CORE_URL:-wss://api.vortex.timant32.ru}
        # Enroll curls binaries from here (not baked into the image).
        VITE_AGENT_BINARY_BASE_URL: ${VITE_AGENT_BINARY_BASE_URL:-https://vortex.timant32.ru/agent}
        VITE_USE_MSW: "false"
    image: vortex-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    # Drop prebuilt linux binaries into ./agent-bins on the host (no agent source).
    volumes:
      - ./agent-bins:/usr/share/nginx/html/agent:ro
